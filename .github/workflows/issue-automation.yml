name: Issue Automation – Project Classic

on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  issues: write
  projects: write

jobs:
  move_issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // ===================================
            // 1. Colonnes du Project Classic
            // ===================================
            const COLUMNS = {
              backlog: 1111111,
              todo: 2222222,
              in_progress: 3333333,
              review: 4444444,
              documentation: 5555555,
              done: 6666666
            };
            
            // ===================================
            // 2. Mapping labels → colonnes
            // ===================================
            const STATUS_MAP = {
              idea: COLUMNS.backlog,
              enhancement: COLUMNS.backlog,
            
              ready: COLUMNS.todo,
              bug: COLUMNS.todo,
            
              "in-progress": COLUMNS.in_progress,
            
              review: COLUMNS.review,
              testing: COLUMNS.review,
            
              documentation: COLUMNS.documentation,
            
              done: COLUMNS.done
            };
            
            // Labels considérés comme "statut"
            const STATUS_LABELS = Object.keys(STATUS_MAP);
            
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const issueId = issue.id;
            const labels = issue.labels.map(l => l.name);
            
            // ===================================
            // 3. Déterminer le label prioritaire
            // (ordre = du plus avancé au moins avancé)
            // ===================================
            const PRIORITY = [
              "done",
              "documentation",
              "review",
              "testing",
              "in-progress",
              "ready",
              "bug",
              "enhancement",
              "idea"
            ];
            
            const activeStatus = PRIORITY.find(l => labels.includes(l));
            
            if (!activeStatus) {
              console.log(`Issue #${issueNumber} : aucun label de statut`);
              return;
            }
            
            const targetColumnId = STATUS_MAP[activeStatus];
            
            // ===================================
            // 4. Nettoyage des autres labels de statut
            // ===================================
            for (const label of STATUS_LABELS) {
              if (label !== activeStatus && labels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
                console.log(`Label ${label} retiré de l’issue #${issueNumber}`);
              }
            }
            
            // ===================================
            // 5. Recherche de la carte existante
            // ===================================
            let existingCard = null;
            
            for (const columnId of Object.values(COLUMNS)) {
              const { data: cards } = await github.rest.projects.listCards({
                column_id: columnId
              });
            
              existingCard = cards.find(
                card => card.content_url?.endsWith(`/issues/${issueNumber}`)
              );
            
              if (existingCard) break;
            }
            
            // ===================================
            // 6. Déplacer ou créer la carte
            // ===================================
            if (existingCard) {
              await github.rest.projects.moveCard({
                card_id: existingCard.id,
                column_id: targetColumnId,
                position: "top"
              });
              console.log(
                `Issue #${issueNumber} déplacée vers ${activeStatus}`
              );
            } else {
              await github.rest.projects.columns.createCard({
                column_id: targetColumnId,
                content_id: issueId,
                content_type: "Issue"
              });
              console.log(
                `Issue #${issueNumber} ajoutée à ${activeStatus}`
              );
            }


