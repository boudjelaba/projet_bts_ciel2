name: Auto-move issues in project columns

on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  issues: read
  projects: write

jobs:
  move_issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // --- 1. Colonnes du projet ---
            const columnIds = {
              backlog: 1111111,
              ready: 2222222,
              in_progress: 3333333,
              review: 4444444,
              documentation: 5555555,
              done: 6666666
            };
            
            // --- 2. Ordre de priorité des labels (aligné BTS) ---
            const priority = [
              "done",
              "in-progress",
              "bug",
              "feature",
              "enhancement",
              "task",
              "chore",
              "documentation",
              "question"
            ];
            
            const issueNumber = context.payload.issue.number;
            const issueId = context.payload.issue.id;
            const issueLabels = context.payload.issue.labels.map(l => l.name);
            
            // --- 3. Sélection du label prioritaire ---
            const selectedLabel = priority.find(label => issueLabels.includes(label));
            
            if (!selectedLabel) {
              console.log(`Aucun label prioritaire pour l’issue #${issueNumber}`);
              return;
            }
            
            // --- 4. Mapping label → colonne ---
            const labelToColumn = {
              done: columnIds.done,
              "in-progress": columnIds.in_progress,
              bug: columnIds.ready,
              feature: columnIds.ready,
              enhancement: columnIds.ready,
              task: columnIds.ready,
              chore: columnIds.ready,
              documentation: columnIds.documentation,
              question: columnIds.backlog
            };
            
            const targetColumnId = labelToColumn[selectedLabel];
            if (!targetColumnId) return;
            
            // --- 5. Recherche de la carte existante ---
            let existingCard = null;
            
            for (const colId of Object.values(columnIds)) {
              const { data: cards } = await github.rest.projects.listCards({ column_id: colId });
              existingCard = cards.find(
                c => c.content_url?.endsWith(`/issues/${issueNumber}`)
              );
              if (existingCard) break;
            }
            
            // --- 6. Déplacer ou créer ---
            if (existingCard) {
              await github.rest.projects.moveCard({
                card_id: existingCard.id,
                position: "top",
                column_id: targetColumnId
              });
              console.log(`Issue #${issueNumber} déplacée vers ${selectedLabel}`);
            } else {
              await github.rest.projects.columns.createCard({
                column_id: targetColumnId,
                content_id: issueId,
                content_type: "Issue"
              });
              console.log(`Issue #${issueNumber} ajoutée à ${selectedLabel}`);
            }

