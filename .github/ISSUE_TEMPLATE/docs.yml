name: Documentation
description: Ajouter ou mettre à jour la documentation
title: "[BTS-XX] Docs : "
labels:
  - documentation
assignees: []

body:
  - type: markdown
    id: intro
    attributes:
      value: |
        ## Documentation
        Utilise ce formulaire pour créer, améliorer ou corriger la documentation.

  - type: textarea
    id: objective
    attributes:
      label: Objectif
      description: Décrire ce qui doit être documenté
      placeholder: |
        Exemple :
        Ajouter la documentation d’installation et de configuration du projet.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Comment ajouter ou modifier la documentation
      placeholder: |
        Exemple :
        - Mettre à jour README.md
        - Ajouter un guide d’utilisation pour `log_analyzer.py`
        - Ajouter des exemples de configuration
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Portée / Fichiers concernés
      description: Fichiers ou sections impactés
      placeholder: |
        Exemple :
        - README.md
        - docs/usage.md
        - docs/installation.md
    validations:
      required: false

  - type: checkboxes
    id: acceptance
    attributes:
      label: Critères d’acceptation
      description: Conditions pour considérer la documentation terminée
      options:
        - label: Documentation mise à jour
        - label: Validée par un relecteur
        - label: Exemples testés et fonctionnels

  - type: textarea
    id: validation
    attributes:
      label: Vérification
      description: Comment vérifier la qualité de la documentation
      placeholder: |
        Exemple :
        - Relecture par un pair
        - Tests des commandes décrites
        - Vérification des liens internes
    validations:
      required: false

  - type: input
    id: link
    attributes:
      label: Lien associé
      description: Issue ou PR liée
      placeholder: Closes #25
    validations:
      required: false
